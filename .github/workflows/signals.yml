name: Auto Crypto Signals

on:
  schedule:
    - cron: "*/30 * * * *"   # Signals every 30 minutes
    - cron: "0 8 * * *"      # Daily digest at 8 AM
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Fetch full history to allow commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit database
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Force-add the database, even if it's ignored
          git add -f signals.db
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Update DB [skip ci]"
          # Push without --force to avoid overwriting other changes
          git push origin main
        continue-on-error: true

      - name: Upload CSV
        uses: actions/upload-artifact@v4
        with:
          name: signals-export
          path: signals_export.csv
          retention-days: 30